name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Jobs that install and execute dependency code must not
# hold a token that can publish packages or push commits; the write grants live
# on the release job, which runs only after `build` passes on main.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: munin
          POSTGRES_PASSWORD: munin
          POSTGRES_DB: munin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U munin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://munin:munin@localhost:5432/munin
      MUNIN_MIGRATE_URL: postgres://munin:munin@localhost:5432/munin
      DATABASE_URL: postgres://munin_app:munin_app@localhost:5432/munin
      MUNIN_AUTH_SECRET: ci-test-secret-not-for-production
      MUNIN_KEY_PEPPER: ci-test-pepper-not-for-production
      MUNIN_EMBEDDING_PROVIDER: stub
      MUNIN_MAIL_PROVIDER: stub
      MUNIN_WEBHOOK_WORKER_DISABLED: '1'
      MUNIN_CMS_SCHEDULE_WORKER_DISABLED: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@getmunin'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Migrate (creates munin_app role + RLS policies + module SQL)
        run: pnpm -F @getmunin/db db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          set -e
          pkgs=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const out = [];
            for (const dir of ['packages', 'apps']) {
              if (!fs.existsSync(dir)) continue;
              for (const sub of fs.readdirSync(dir)) {
                const pj = path.join(dir, sub, 'package.json');
                if (!fs.existsSync(pj)) continue;
                const m = JSON.parse(fs.readFileSync(pj, 'utf8'));
                if (m.scripts && m.scripts.test) out.push(m.name);
              }
            }
            console.log(out.join(' '));
          ")
          echo "# Test results" >> "$GITHUB_STEP_SUMMARY"
          for pkg in $pkgs; do
            echo "::group::Test $pkg"
            sum=$(mktemp)
            rc=0
            GITHUB_STEP_SUMMARY="$sum" pnpm --filter "$pkg" test || rc=$?
            # Vitest's reporter emits a generic "## Vitest Test Report"; relabel per package.
            if [ -s "$sum" ]; then
              sed "s|^## Vitest Test Report|## $pkg|" "$sum" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      - name: Build
        run: pnpm build

  release:
    name: release (changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@getmunin'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `pnpm release` builds the publishable packages, then runs `changeset
      # publish` — the app builds this job does not need are skipped.
      - name: Release (Changesets)
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: 'chore: release'
          title: 'chore: release packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregated GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/aggregate-release.mjs

      - name: Publish to MCP Registry
        if: steps.changesets.outputs.published == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(JSON.parse(process.env.PUBLISHED_PACKAGES)[0].version)")
          echo "Publishing com.getmunin/munin@$VERSION to the MCP registry"
          jq --arg v "$VERSION" '.version = $v' server.json > server.json.tmp && mv server.json.tmp server.json
          curl -sSLf -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login dns --domain getmunin.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish

  licenses:
    name: license policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `contents: write` is load-bearing: the regen step below pushes back to
    # Dependabot branches. It is the only non-release job holding a write token.
    permissions:
      contents: write

    steps:
      # Branch tip, not the merge commit, so the regen step can push back. Fork PRs
      # fall back to the default ref: their head branch does not exist here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@getmunin'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Dependabot cannot run licenses:generate, so its bumps failed this job by
      # construction. The check below still runs, so an unapproved license blocks merge.
      - name: Regenerate notices for Dependabot
        if: startsWith(github.head_ref, 'dependabot/')
        run: |
          pnpm licenses:generate
          if git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo 'THIRD_PARTY_LICENSES.md already up to date'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: regenerate THIRD_PARTY_LICENSES.md' -- THIRD_PARTY_LICENSES.md
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - name: Check licenses
        run: pnpm licenses:check

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@getmunin'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build internal packages the web app depends on
        run: pnpm --filter '@getmunin/dashboard-pages' --filter '@getmunin/sdk' --filter '@getmunin/types' --filter '@getmunin/ui' build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @getmunin/web exec playwright install --with-deps chromium

      - name: Install browser deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @getmunin/web exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @getmunin/web e2e

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
