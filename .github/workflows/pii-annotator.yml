name: pii-annotator

on:
  push:
    branches: [main]
    paths:
      - 'workers/pii-annotator/**'
      - '.github/workflows/pii-annotator.yml'
  pull_request:
    paths:
      - 'workers/pii-annotator/**'
      - '.github/workflows/pii-annotator.yml'

concurrency:
  group: pii-annotator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/pii-annotator
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install ".[test]"
      - run: python -m pytest -q

  # The image is published publicly so any install — or any scheduler — can
  # pull it without registry credentials. Only the release on main pushes; pull
  # requests build both targets to prove the Dockerfile still resolves.
  image:
    name: image (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [lite, full]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workers/pii-annotator
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/getmunin/pii-annotator:${{ matrix.target }}
            ghcr.io/getmunin/pii-annotator:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha,scope=pii-annotator-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pii-annotator-${{ matrix.target }}
