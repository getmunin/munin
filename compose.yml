# Self-host Munin in one command:
#
#   git clone https://github.com/getmunin/munin.git
#   cd munin
#   cp .env.example .env
#   docker compose up
#
# Brings up: Postgres + pgvector, Munin backend, Munin web.
#
# Optional: the NER worker that finds third-party names for MCP
# pseudonymization. Off unless you ask for it — set MUNIN_PII_NER_ENABLED and
# MUNIN_PII_WORKER_SECRET in .env, then `docker compose --profile pii up`.
# MUNIN_PII_TIER=full switches from the small spaCy model to spaCy + GLiNER.
#
# The placeholder secrets in .env.example are auto-generated on first boot
# and persisted in the munin-data volume — fine for local/single-host
# self-hosting. For shared or production deployments, set strong
# MUNIN_AUTH_SECRET / MUNIN_KEY_PEPPER / MUNIN_ENCRYPTION_KEY values in .env
# (`openssl rand -base64 48`) instead of relying on the generated ones.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-munin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-munin}
      POSTGRES_DB: ${POSTGRES_DB:-munin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - munin-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-munin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      MUNIN_MIGRATE_URL: postgres://${POSTGRES_USER:-munin}:${POSTGRES_PASSWORD:-munin}@postgres:5432/${POSTGRES_DB:-munin}
      DATABASE_URL: postgres://munin_app:munin_app@postgres:5432/${POSTGRES_DB:-munin}
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    volumes:
      - munin-data:/var/munin
    ports:
      - "${BACKEND_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

  pii-annotator:
    profiles: [pii]
    build:
      context: workers/pii-annotator
      target: ${MUNIN_PII_TIER:-lite}
    image: ghcr.io/getmunin/pii-annotator:${MUNIN_PII_TIER:-lite}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MUNIN_API_URL: http://backend:3001
      MUNIN_PII_WORKER_SECRET: ${MUNIN_PII_WORKER_SECRET:-}
      PII_LOOP_INTERVAL_SECONDS: ${PII_LOOP_INTERVAL_SECONDS:-300}
    command: ["--loop"]
    volumes:
      - munin-pii-models:/models

volumes:
  munin-pg:
  munin-data:
  munin-pii-models:
